name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run compile
      # validates the manifest and builds the production bundle
      - run: pnpm run package

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # the minimum supported version from engines.vscode, and the latest one
        vscode: ["1.90.0", stable]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: xvfb-run -a pnpm test
        env:
          VSCODE_TEST_VERSION: ${{ matrix.vscode }}

  release-please:
    if: github.event_name == 'push'
    needs: [check, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release

  package:
    if: needs.release-please.outputs.release_created == 'true'
    needs: release-please
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run package
      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: "*.vsix"
      - run: gh release upload "$TAG" ./*.vsix
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}

  publish-marketplace:
    needs: package
    runs-on: ubuntu-latest
    # the federated credential of the Microsoft Entra ID app is bound to this environment
    environment: marketplace
    permissions:
      contents: read
      # lets azure/login exchange the GitHub OIDC token for an Entra ID token
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: vsix
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          # vsce only needs a tenant-scoped token, not a subscription context
          allow-no-subscriptions: true
      - run: pnpm exec vsce publish --azure-credential --packagePath ./*.vsix

  publish-open-vsx:
    needs: package
    runs-on: ubuntu-latest
    environment: open-vsx
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: vsix
      - run: pnpm exec ovsx publish --trusted-publishing --packagePath ./*.vsix
